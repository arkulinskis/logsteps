<div class="ad-scan-item">
  <div class="ui-item ad-scan">
    <div class="ad-pic"><img alt="" anvil:dom-node="pic"></div>
    <div class="grow">
      <div class="ad-scan-title">
        <anvil-component type="Label" name="title" prop:role='["strong"]'></anvil-component>
        <span class="ui-badge" anvil:name="demo_badge">Demo</span>
        <anvil-component type="Label" name="status" prop:role='["badge"]'></anvil-component>
      </div>
      <anvil-component type="Label" name="meta" prop:role='["fine-print"]'></anvil-component>
      <anvil-component type="Label" name="error" prop:role='["bad-text"]'></anvil-component>
    </div>
    <anvil-component type="DropDown" name="vis_box" prop:role='["ad-vis"]'></anvil-component>
    <a class="ui-btn sm icon" anvil:name="open_link" href="#home" aria-label="Open"><i class="ic ic-eye"></i></a>
    <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-sm", "btn-danger", "btn-icon", "ic-trash"]'></anvil-component>
  </div>
</div>
