<div class="ls-card-item">
  <a class="ls-card" anvil:name="link" href="#home">
    <div class="ls-thumb" anvil:name="thumb">
      <div class="art" anvil:dom-node="art"></div>
      <img alt="" loading="lazy" anvil:dom-node="pic">
      <div class="ls-tl">
        <span class="ui-badge" anvil:name="st_badge"><i class="ic" anvil:name="st_icon"></i><anvil-component type="Label" name="st_text" prop:role='["badge-text"]'></anvil-component></span>
        <span class="ui-badge" anvil:name="sample_badge"><i class="ic ic-sparkle"></i>Sample</span>
      </div>
      <div class="ls-tr">
        <span class="ui-badge" anvil:name="vis_badge"><i class="ic" anvil:name="vis_icon"></i><anvil-component type="Label" name="vis_text" prop:role='["badge-text"]'></anvil-component></span>
      </div>
      <div class="ls-prog" anvil:name="prog">
        <anvil-component type="Label" name="stage" prop:role='["prog-stage"]'></anvil-component>
        <div class="track" anvil:name="track"><i class="track-fill" anvil:name="bar"></i></div>
      </div>
      <div class="ls-dim" anvil:name="dim"><i class="tick tick-l"></i><anvil-component type="Label" name="dim_text" prop:role='["dim-text"]'></anvil-component><i class="tick tick-r"></i></div>
    </div>
    <div class="ls-card-body">
      <anvil-component type="Label" name="title" prop:role='["card-h"]'></anvil-component>
      <anvil-component type="Label" name="meta" prop:role='["card-meta"]'></anvil-component>
      <anvil-component type="Label" name="stats" prop:role='["card-stats"]'></anvil-component>
    </div>
  </a>
  <a class="lb-new" anvil:name="new_tile" href="#capture">
    <span><i class="ic ic-scan"></i><b>Scan a room</b><span class="small">About a minute of slow walking</span></span>
  </a>
</div>
