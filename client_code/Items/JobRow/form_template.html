<div class="ad-job-item">
  <div class="ui-item ad-job">
    <div class="grow">
      <div class="ad-scan-title">
        <anvil-component type="Label" name="title" prop:role='["strong"]'></anvil-component>
        <anvil-component type="Label" name="status" prop:role='["badge"]'></anvil-component>
      </div>
      <anvil-component type="Label" name="meta" prop:role='["fine-print"]'></anvil-component>
      <anvil-component type="Label" name="error" prop:role='["bad-text"]'></anvil-component>
      <div class="ad-bar" anvil:name="bar"><i class="ad-bar-fill" anvil:name="fill"></i></div>
    </div>
    <anvil-component type="Button" name="retry_button" prop:text="Retry" prop:role='["btn", "btn-sm", "ic-refresh"]'></anvil-component>
    <anvil-component type="Button" name="stop_button" prop:text="Stop" prop:role='["btn", "btn-sm"]'></anvil-component>
  </div>
</div>
