<div class="sc-ver-item">
  <div class="sc-ver" anvil:name="row">
    <anvil-component type="Label" name="n" prop:role='["ver-n"]'></anvil-component>
    <div class="sc-ver-text">
      <anvil-component type="Label" name="note"></anvil-component>
      <anvil-component type="Label" name="meta" prop:role='["fine-print"]'></anvil-component>
    </div>
    <div class="sc-ver-actions">
      <span class="ui-badge good" anvil:name="in_use">In use</span>
      <anvil-component type="Button" name="use_button" prop:text="Use" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="delete_button" prop:text="Delete" prop:role='["btn", "btn-sm", "btn-ghost", "btn-icon", "ic-trash"]'></anvil-component>
    </div>
  </div>
</div>
