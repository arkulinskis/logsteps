    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=243ae4a549">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=5857c22eab">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
