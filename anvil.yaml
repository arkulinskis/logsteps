    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://logsteps.com/#app", "name": "Logsteps", "url": "https://logsteps.com/", "description": "Walk a room with your phone and get a 3D model you can replay, measure, pin notes on, share with a link and edit on your computer.", "image": "https://logsteps.com/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "3D room scan, phone 3D scanner, room scanning app, 3D model of a room, measure a room from video, share 3D room, photogrammetry, point cloud viewer, PLY GLB viewer", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["Guided camera walk that skips blurry frames and warns when it is too dark", "Upload a video or import a PLY or GLB 3D file", "Orbit, Walk and Plan views, replay, measure and pins", "Share a room with a private link", "Explore public rooms by room type"], "audience": {"@type": "Audience", "audienceType": "Home owners, renters, designers and anyone who wants to share a room in 3D"}}, {"@type": "WebSite", "@id": "https://logsteps.com/#site", "url": "https://logsteps.com/", "name": "Logsteps", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
